const NAME={desk:'Porar Table 📚',books:'Boi er Stack 📚',bag:'School Bag 🎒',obook:'Khola Boi 📖',bed:'Bichana 🛏️',shelf:'Shelf',plant:'Gach 🪴',lamp:'Lamp',bean:'Bean Bag',ball:'Basketball 🏀',guitar:'Guitar 🎸',slip:'Slippers',mug:'Cha ☕',cat:'Biral 🐱',phone:'PHONE!! 📱'};
const BSAY=["Porte boshbo na!","Ajke mood nai!","Boi dekhlei ghum paay!","Kalke theke serious, pakka!"];
const K={u:0,l:0,d:0,r:0};
let mom={on:0,t:1},M,mi=0,mx,my,segs,P,moms,items,hist,bs,bub,bounces,t0,st='menu',grace,shake=0,walk=0,cool=0;
const open=(c,r,d)=>d==0?M.H[r][c]=='0':d==2?M.H[r+1][c]=='0':d==3?M.V[r][c]=='0':M.V[r][c+1]=='0';
const DX=[0,1,0,-1],DY=[-1,0,1,0],inb=(c,r)=>c>=0&&r>=0&&c<M.C&&r<M.R;
const nb=(c,r)=>{const o=[];for(let d=0;d<4;d++){const a=c+DX[d],b=r+DY[d];if(inb(a,b)&&open(c,r,d))o.push([a,b])}return o};
const ctr=(c,r)=>[mx+(c+.5)*CS,my+(r+.5)*CS];
function bfs(a,b){const pr={},dist={},k=(c,r)=>c+','+r;let q=[a];dist[k(...a)]=0;
 for(let i=0;i<q.length;i++){const [c,r]=q[i];for(const n of nb(c,r)){const kk=k(...n);if(!(kk in dist)){dist[kk]=dist[k(c,r)]+1;pr[kk]=[c,r];q.push(n)}}}
 const path=new Set();let c=b;while(c){path.add(k(...c));c=pr[k(...c)]}return{dist,path}}
function blk(px,py,r){for(const s of segs){const dx=px-clamp(px,s[0],s[2]),dy=py-clamp(py,s[1],s[3]);if(dx*dx+dy*dy<(r+3.5)*(r+3.5))return 1}return 0}
const RAD=CS*.17;
function newGame(i){mi=i;M=D[i];mx=(RW-M.C*CS)/2;my=112;segs=[];
 for(let r=0;r<=M.R;r++)for(let c=0;c<M.C;c++)if(M.H[r][c]=='1')segs.push([mx+c*CS,my+r*CS,mx+(c+1)*CS,my+r*CS]);
 for(let r=0;r<M.R;r++)for(let c=0;c<=M.C;c++)if(M.V[r][c]=='1')segs.push([mx+c*CS,my+r*CS,mx+c*CS,my+(r+1)*CS]);
 const A=[0,M.s],B=[M.C-1,M.e],{dist,path}=bfs(A,B),cells=[];
 for(let r=0;r<M.R;r++)for(let c=0;c<M.C;c++)cells.push([c,r]);cells.sort(()=>Math.random()-.5);
 const used=new Set([A+'',B+'']);items=[];let nd=0;
 for(const c of cells){if(used.has(c+'')||path.has(c+'')||dist[c+'']<3)continue;const q=Math.random();
  if(q<.52)items.push({c:c[0],r:c[1],n:rnd(STUDY),study:1});else if(q<.76)items.push({c:c[0],r:c[1],n:DECOR[nd++%DECOR.length]})}
 items.forEach(it=>[it.x,it.y]=ctr(it.c,it.r));
 mom={on:0,t:1};
 const [sx,sy]=ctr(0,M.s);P={x:sx,y:sy,face:1,hop:0};hist=[[0,M.s]];bs=null;bub=null;bounces=0;t0=performance.now();grace=2.5;st='play';$('modal').style.display='none'}
const cellOf=(px,py)=>[Math.floor((px-mx)/CS),Math.floor((py-my)/CS)];
function say(t,ms=1500){bub={t,until:performance.now()+ms}}
function update(dt){
 if(grace>0)grace-=dt;
 if(bs){bs.t+=dt/.5;const k=Math.min(1,bs.t),e=k*(2-k);P.x=bs.fx+(bs.tx-bs.fx)*e;P.y=bs.fy+(bs.ty-bs.fy)*e;P.hop=Math.sin(k*Math.PI)*CS*.6;if(k>=1){bs=null;P.hop=0;cool=.5}}
 else{let dx=K.r-K.l,dy=K.d-K.u;const mv=!!(dx||dy);if(dx&&dy){dx*=.7071;dy*=.7071}const sp=215*dt;
  if(dx){const n=P.x+dx*sp;if(!blk(n,P.y,RAD))P.x=n;P.face=dx>0?1:-1}
  if(dy){const n=P.y+dy*sp;if(!blk(P.x,n,RAD))P.y=n}
  if(dx&&!dy){const cy=my+(Math.floor((P.y-my)/CS)+.5)*CS,s=clamp(cy-P.y,-sp*.7,sp*.7);if(!blk(P.x,P.y+s,RAD))P.y+=s}
  if(dy&&!dx){const cx2=mx+(Math.floor((P.x-mx)/CS)+.5)*CS,s=clamp(cx2-P.x,-sp*.7,sp*.7);if(!blk(P.x+s,P.y,RAD))P.x+=s}
  P.x=clamp(P.x,mx-CS*.45,mx+M.C*CS+CS*.45);P.y=clamp(P.y,my+RAD,my+M.R*CS-RAD);if(mv)walk+=dt*11;P.mv=mv;
  const [c,r]=cellOf(P.x,P.y);if(inb(c,r)){const l=hist[hist.length-1];if(l[0]!=c||l[1]!=r){const p=hist[hist.length-2];if(p&&p[0]==c&&p[1]==r)hist.pop();else hist.push([c,r])}}
  cool-=dt;if(cool<=0)for(const it of items)if(it.study&&Math.hypot(P.x-it.x,P.y-it.y)<CS*.42){
   hist.splice(Math.max(1,hist.length-2));const [tc,tr]=hist[hist.length-1],[tx,ty]=ctr(tc,tr);bs={t:0,fx:P.x,fy:P.y,tx,ty};bounces++;shake=14;say(rnd(BSAY));break}
  const [ex,ey]=ctr(M.C-1,M.e);if(Math.hypot(P.x-ex,P.y-ey)<CS*.6)return end(true)}
 const [pc,pr]=cellOf(P.x,P.y);
 if(grace<=0){mom.t-=dt;
  if(mom.t<=0){mom.t=4+Math.random()*2.5;const cs=[];for(let r=0;r<M.R;r++)for(let c=0;c<M.C;c++)if(Math.abs(c-pc)+Math.abs(r-pr)>=7)cs.push([c,r]);const c=rnd(cs),[px,py]=ctr(...c);
   Object.assign(mom,{on:1,c:c[0],r:c[1],x:px,y:py,tc:c[0],tr:c[1],pc:-1,pr:-1,age:0,face:1});say('MA ASHTESE! 😱',1300);shake=10}
  if(mom.on){mom.age+=dt;const [tx,ty]=ctr(mom.tc,mom.tr),d=Math.hypot(tx-mom.x,ty-mom.y),sp=85*dt;
   if(d<=sp){mom.x=tx;mom.y=ty;mom.pc=mom.c;mom.pr=mom.r;mom.c=mom.tc;mom.r=mom.tr;const o=nb(mom.c,mom.r);let c=o.filter(n=>!(n[0]==mom.pc&&n[1]==mom.pr));if(!c.length)c=o;let n=rnd(c);
    if(Math.random()<.3&&Math.abs(pc-mom.c)+Math.abs(pr-mom.r)<8)n=o.slice().sort((a,b)=>Math.abs(a[0]-pc)+Math.abs(a[1]-pr)-Math.abs(b[0]-pc)-Math.abs(b[1]-pr))[0];mom.tc=n[0];mom.tr=n[1]}
   else{mom.x+=(tx-mom.x)/d*sp;mom.y+=(ty-mom.y)/d*sp;if(Math.abs(tx-mom.x)>.5)mom.face=tx>mom.x?1:-1}
   if(mom.age>1&&Math.hypot(P.x-mom.x,P.y-mom.y)<CS*.55)return end(false)}}}
function end(win){st='over';const t=((performance.now()-t0)/1000|0)+'s';$('modal').style.display='flex';
 $('card').innerHTML=win?`<h2>🏆 MISSION COMPLETE!<br>PHONE ACQUIRED!</h2><p>“Kalke theke serious. PAKKA!”</p><p>Time ${t} · Bounces ${bounces}</p><button onclick="newGame((mi+1+(Math.random()*2|0))%3)">Play another maze</button>`
 :`<h2>💀 GAME OVER!<br>MA DHORE FELSE!</h2><p>“Ebar porte bosh…” 📚</p><button onclick="newGame(mi)">Try again</button>`}
function menu(){st='menu';$('modal').style.display='flex';$('card').innerHTML=`<h2>📱 KALKE THEKE SERIOUS</h2><p>Exam kalke, but study? <b>Ajke na!</b> Walk the boy through his bedroom to reach his <b>phone</b>.</p><p>📚 Books, desks and bags bounce him 2 steps back.<br>👩 Moms patrol — if Ma dhore felse, game over!</p><p>Arrow keys / WASD to walk.</p><button id="go">▶ PLAY</button>`;$('go').onclick=()=>newGame(Math.random()*3|0)}
function sprite(n,px,py,h,flip,maxw){const i=IM[n];if(!i.complete||!i.naturalWidth)return;let w=h*i.naturalWidth/i.naturalHeight;if(maxw&&w>maxw){h*=maxw/w;w=maxw}x.save();x.translate(px,py);if(flip<0)x.scale(-1,1);x.drawImage(i,-w/2,-h,w,h);x.restore()}
function shadow(px,py,w){x.fillStyle='rgba(40,20,10,.28)';x.beginPath();x.ellipse(px,py,w,w*.3,0,0,7);x.fill()}
function drawRoom(ts){
 x.fillStyle='#2a1b3d';x.fillRect(0,0,RW,RH);
 const fx=mx-CS*.9,fw=M.C*CS+CS*1.8,fy=my-CS*.6,fh=M.R*CS+CS*1.2;
 x.fillStyle='#f6d79c';x.fillRect(fx,fy,fw,fh);x.strokeStyle='#e3c080';x.lineWidth=1;
 for(let y=fy;y<fy+fh;y+=CS/3){x.beginPath();x.moveTo(fx,y);x.lineTo(fx+fw,y);x.stroke()}
 x.strokeStyle='#4a241a';x.lineWidth=5;x.strokeRect(fx,fy,fw,fh);
 x.font='bold 34px "Trebuchet MS",sans-serif';x.textAlign='left';x.fillStyle='#ffd24a';x.fillText('📱 KALKE THEKE SERIOUS',fx,46);
 x.font='bold 20px sans-serif';x.fillStyle='#fff3d6';x.fillText(`Maze ${mi+1}    ⏱ ${st=='play'?((performance.now()-t0)/1000|0):0}s    💥 Bounces ${bounces||0}`,fx,78);
 for(let i=0;i<30;i++){const lx=fx+20+i*(fw-40)/29,ly=fy-8+Math.sin(i)*3,g=.55+.45*Math.sin(ts/400+i);x.fillStyle=`rgba(255,215,90,${g})`;x.beginPath();x.arc(lx,ly,4,0,7);x.fill()}
 const [sx,sy]=ctr(0,M.s);x.fillStyle='#2fa7a0';x.beginPath();x.roundRect(sx-CS*.4,sy-CS*.3,CS*.8,CS*.6,6);x.fill();
 x.fillStyle='#2e9a5b';x.font='bold 15px sans-serif';x.textAlign='center';x.fillText('START ▶',mx-CS*.5,sy+5);
 const [ex,ey]=ctr(M.C-1,M.e);x.fillStyle='#c0392b';x.fillText('◀ PHONE',mx+M.C*CS+CS*.45,ey+5);
 const g=x.createRadialGradient(ex,ey,2,ex,ey,CS*1.2);g.addColorStop(0,'rgba(255,230,90,.7)');g.addColorStop(1,'rgba(255,230,90,0)');x.fillStyle=g;x.fillRect(ex-CS*1.5,ey-CS*1.5,CS*3,CS*3)}
function drawWalls(){x.lineCap='round';x.beginPath();for(const s of segs){x.moveTo(s[0],s[1]);x.lineTo(s[2],s[3])}x.strokeStyle='#4a241a';x.lineWidth=8;x.stroke();x.strokeStyle='#7a4630';x.lineWidth=3;x.stroke()}
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!M)return;if(st=='play')update(dt);
 x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.setTransform(S,0,0,S,OX,OY);
 if(shake>0){x.translate(Math.sin(shake*3)*4,0);shake--}
 drawRoom(ts);drawWalls();
 const L=[];for(const it of items)L.push({y:it.y+CS*.28,f:()=>{shadow(it.x,it.y+CS*.3,CS*.32);sprite(it.n,it.x,it.y+CS*.3,CS*1.05,1,CS*1.15)}});
 const [ex,ey]=ctr(M.C-1,M.e);L.push({y:ey+CS*.28,f:()=>sprite('phone',ex,ey+CS*.45,CS*1.6,1,CS*1.5)});
 if(mom.on)L.push({y:mom.y,f:()=>{x.save();if(mom.age<1){x.fillStyle=`rgba(240,50,70,${.25+.2*Math.sin(mom.age*20)})`;x.beginPath();x.arc(mom.x,mom.y,CS*1.1,0,7);x.fill();x.globalAlpha=.4+.6*mom.age}shadow(mom.x,mom.y,CS*.38);sprite('mom',mom.x,mom.y+CS*.1,CS*1.5,mom.face,CS*1.3);x.restore()}});
 if(P)L.push({y:P.y,f:()=>{const bob=P.mv&&!bs?Math.abs(Math.sin(walk))*4:0;shadow(P.x,P.y,CS*.34);sprite('boy',P.x,P.y+CS*.1-bob-P.hop,CS*1.55,P.face)}});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 if(P&&st=='play'){let b=null,bd=CS*1.3;for(const it of items){const d=Math.hypot(P.x-it.x,P.y-it.y);if(d<bd){bd=d;b=it}}
  if(Math.hypot(P.x-ex,P.y-ey)<bd){b={n:'phone',x:ex,y:ey}}
  if(b)tag(NAME[b.n],b.x,b.y-CS*.75)}
 if(bub&&performance.now()<bub.until&&P)tag(bub.t,P.x,P.y-CS*1.2,1);else bub=null}
function tag(t,px,py,speech){x.font='600 16px system-ui';const w=x.measureText(t).width+20;px=clamp(px,w/2+4,RW-w/2-4);
 x.fillStyle=speech?'#fff':'rgba(18,22,40,.88)';x.beginPath();x.roundRect(px-w/2,py-14,w,28,14);x.fill();if(speech){x.strokeStyle='#4a241a';x.lineWidth=2;x.stroke()}
 x.fillStyle=speech?'#4a241a':'#fff';x.textAlign='center';x.fillText(t,px,py+5)}
addEventListener('keydown',e=>{const k={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[e.key];if(k){e.preventDefault();K[k]=1}});
addEventListener('keyup',e=>{const k={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[e.key];if(k)K[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b['on'+v]=()=>K[k]=0)});
$('bn').onclick=()=>newGame((mi+1+(Math.random()*2|0))%3);$('br').onclick=()=>newGame(mi);
M=D[0];mx=(RW-M.C*CS)/2;my=112;segs=[];items=[];mom={on:0,t:1};bounces=0;t0=performance.now();menu();requestAnimationFrame(frame);
</script></body></html>
